server:
  port: 8080

spring:
  application:
    name: api-gateway

    name=api-gateway:cloud:
    gateway:
      routes:
        - id: resident-service
          uri: http://localhost:8081
          predicates:
            - Path=/resident/**
        - id: grievance-service
          uri: http://localhost:8082
          predicates:
            - Path=/grievance/**
      default-filters:
        - AddResponseHeader=X-Gateway-Header, GatewayActive
  main:
    web-application-type: reactive

management:
  endpoints:
    web:
      exposure:
        include: "*"

gateway:
  api-key: my-secret-api-key

