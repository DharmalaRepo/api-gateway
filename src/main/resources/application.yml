server:
  port: 8080

spring:
  security:
    user:
      name: admin
      password: admin123

  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: resident-service
          uri: http://resident-service.default.svc.cluster.local:9090
          predicates:
            - Path=/resident/**
      default-filters:
        - AddResponseHeader=X-Gateway-Header, GatewayActive

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  security:
    enabled: true
    roles: ACTUATOR
  server:
    add-application-context-header: false

gateway:
  api-key: dharmala

logging:
  level:
    io.netty: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG