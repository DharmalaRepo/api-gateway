server:
  port: 8080

spring:
  security:
    user:
      name: admin
      password: admin123
  application:
    name: api-gateway
    gateway:
      routes:
        - id: resident-service
          uri: http://localhost:9090
          predicates:
            - Path=/resident/**
        - id: grievance-service
          uri: http://localhost:8082
          predicates:
            - Path=/grievance/**
      default-filters:
        - AddResponseHeader=X-Gateway-Header, GatewayActive
  main:
    web-application-type: reactive
  cloud:
    compatibility-verifier:
      enabled: false
      gateway:
        routes:
          - id: resident-service
            uri: http://resident-service.default.svc.cluster.local
            predicates:
              - Path=/resident/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true

gateway:
  api-key: dharmala

logging:
  level:
    io.netty: DEBUG
